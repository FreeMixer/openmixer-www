card:
  en:
    title: Ducker, doubler and tone
    line: Music under a voice, a double-tracked sound without a second take, and a tone tilt with a DJ filter.
    text: omx-ducker pulls the programme down while a key is heard, by a set depth with attack, hold and release. omx-doubler adds up to four slightly delayed, detuned and drifting copies spread across the stereo field. omx-tone tilts the whole tone darker or brighter about a pivot and sweeps a resonant DJ filter with one knob.
  ca:
    title: Ducker, doubler i tone
    line: Música sota una veu, un so de doble presa sense una segona presa, i una inclinació de to amb un filtre de DJ.
    text: omx-ducker abaixa el programa mentre se sent una clau, amb una fondària fixada i atac, manteniment i alliberament. omx-doubler afegeix fins a quatre còpies lleugerament retardades, desafinades i a la deriva, repartides pel camp estèreo. omx-tone inclina tot el to cap a més fosc o més brillant al voltant d'un pivot i fa un escombrat amb un filtre de DJ ressonant amb un sol botó.
