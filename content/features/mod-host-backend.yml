card:
  en:
    title: MOD-UI on plugin-hostd
    line: MOD-UI can run on plugin-hostd instead of mod-host. Switching back is one setting.
    text: plugin-hostd speaks mod-host's protocol, so MOD-UI pedalboards run on it with crash isolation and the qualification behind them. A setting picks the backend, and the old one stays available.
  ca:
    title: MOD-UI sobre plugin-hostd
    line: MOD-UI pot córrer sobre plugin-hostd en lloc de mod-host. Tornar enrere és un sol paràmetre.
    text: plugin-hostd parla el protocol de mod-host, de manera que les pedalboards de MOD-UI hi corren amb l'aïllament d'errors i la qualificació al darrere. Un paràmetre tria el motor i l'anterior continua disponible.
