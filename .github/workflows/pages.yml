# SPDX-License-Identifier: GPL-3.0-or-later
#
# Build the site and publish it at https://freemixer.github.io/, the root of the
# organisation's Pages site.
#
# WHERE IT GOES. The root is served from FreeMixer/freemixer.github.io, which also
# holds the package repositories (rpm/, deb/, the keys), written by the release
# workflows of FreeMixer/.github. So this workflow does not deploy a Pages artifact:
# it checks that repository out with PAGES_TOKEN and scripts/deploy-root.sh replaces
# only the top-level paths listed in deploy/site-owns.txt, refuses a change that
# reaches anything else (rpm/, deb/, .nojekyll, README.md above all), and commits
# and pushes to its main. A pull request runs the same steps as a dry run.
#
# THE COMMIT IS SIGNED with SITE_GPG_KEY, a signing key whose public half is on the
# committer's GitHub account, so GitHub shows it verified. Without that secret the
# publish step refuses to push; the dry run does not need it.
#
# THE OLD ADDRESS. The site used to be served at /openmixer-www/. Every page now has
# a redirect page at its old address (scripts/redirect-stubs.mjs), published under
# /openmixer-www/ of the root site. They answer once this repository's own Pages site
# is switched off; until then that site keeps serving the old copy there.
#
# BASE URL is "/": the site sits at the domain root. `npm run docs:links` still fails
# the build on any internal link that does not resolve.
#
# THE DOCUMENTATION TREE IS BUILT, NOT COPIED. The operator manual, the FAQ and the
# architecture pages live in FreeMixer/openmixer (docs/**/*.md) and are rendered by
# that repo's own `packages/website` build, which is also what a console serves
# offline at /help. `npm run docs:site` checks that build out, runs it with this
# site's prefix and publishes its /docs/** tree here — one source, one renderer, and
# nothing of the prose committed twice. See scripts/build-docs-tree.mjs.
#
# THE TOKEN. FreeMixer/openmixer is private, so the checkout below needs a
# credential with read access to it (Settings -> Secrets -> Actions:
# OPENMIXER_DOCS_KEY, the private half of a read-only deploy key registered on that repository).
# Without it this workflow FAILS rather than publishing a site whose manual 404s —
# a site that quietly lost a third of its pages looks exactly like a site that never
# had them. The root keeps serving the previous commit while a run is red.
#
# TRIGGER. Push to main plus dispatch; a pull request runs as a dry run. openmixer's dispatch-only law
# (docs/design/specs/2026-09-02-delivery-pipeline.md §0) binds the workflows that
# publish PACKAGES and IMAGES, and its own gate names the static-site workflow as
# the single exception — "publishes a static site to Pages on push to main. It
# touches no package, no repo tree and no image ... and retriggering it is not a
# publish anyone has to decide about" (packages/server/src/workflow-trigger-
# conformance.test.ts, NAMED_EXCEPTIONS). This is that workflow, in the site's own
# repository. It now commits into the Pages repository that also carries the
# package trees, and the guard in scripts/deploy-root.sh is what keeps it from
# touching them.
name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NUXT_APP_BASE_URL: /
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        working-directory: openmixer-www
    steps:
      - uses: actions/checkout@v4
        with:
          path: openmixer-www

      # NOT checked out as "openmixer": the REST/API generators (scripts/gen-*.mjs)
      # read a sibling ../openmixer as "regenerate from source", which needs a full
      # workspace build this runner does not do. With no sibling by that name they
      # publish the committed snapshots, which is what they are committed for. The
      # docs tree is given its path explicitly, below.
      - uses: actions/checkout@v4
        with:
          repository: FreeMixer/openmixer
          ref: main
          ssh-key: ${{ secrets.OPENMIXER_DOCS_KEY }}
          path: openmixer-src

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: openmixer-www/package-lock.json

      - run: npm ci

      - run: npm run generate

      - run: npm run docs:site
        env:
          OPENMIXER_SRC: ${{ github.workspace }}/openmixer-src

      - run: node scripts/redirect-stubs.mjs

      # After the docs tree and the redirect pages are in place, so every link is
      # checked in the tree that is published.
      - run: npm run docs:links

      # The root site, with the package repositories in it. The token is only needed to
      # push; a pull request reads the public repository without it.
      - uses: actions/checkout@v4
        with:
          repository: FreeMixer/freemixer.github.io
          ref: main
          path: pages
          token: ${{ env.PUBLISH == 'true' && secrets.PAGES_TOKEN || github.token }}

      - name: Import the signing key
        if: env.PUBLISH == 'true'
        working-directory: pages
        env:
          SITE_GPG_KEY: ${{ secrets.SITE_GPG_KEY }}
        run: |
          [ -n "$SITE_GPG_KEY" ] || { echo "::error::SITE_GPG_KEY is not set; the site is not published unsigned"; exit 1; }
          fpr=$(printf '%s\n' "$SITE_GPG_KEY" | gpg --batch --import --import-options show-only --with-colons 2>/dev/null | awk -F: '$1=="fpr"{print $10; exit}')
          printf '%s\n' "$SITE_GPG_KEY" | gpg --batch --import
          git config user.name "Pau Aliagas"
          git config user.email linuxnow@gmail.com
          git config user.signingkey "$fpr"
          git config commit.gpgsign true

      - name: Deploy into freemixer.github.io (dry run on a pull request)
        run: |
          export SITE_REVISION=${GITHUB_SHA::9}
          if [ "$PUBLISH" = true ]; then
            scripts/deploy-root.sh .output/public ../pages --publish
          else
            scripts/deploy-root.sh .output/public ../pages
          fi
